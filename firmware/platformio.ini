[env:xera]
platform = espressif32@^6.0.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

; Serial over native USB.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Same firmware, Serial over the UART port (CH343 chip next to the USB-C "UART" connector;
; it shows up as COM23 on Windows or /dev/ttyACM0 on Linux).
; Use this one if you plug the rover through that connector:  pio run -e xera-uart -t upload
[env:xera-uart]
extends = env:xera
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
