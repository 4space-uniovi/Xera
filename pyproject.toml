[project]
name = "4space-mini-rover"
version = "0.1.0"
description = "Control web para mini rovers de 4Space Uniovi (Arduino UNO Q + ESP32-S3)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pyyaml>=6",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
